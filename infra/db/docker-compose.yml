name: geduc-rag-db

# MySQL de DESENVOLVIMENTO do geduc-rag. Vetores do RAG ficam aqui mesmo:
# `document_chunk.embedding` é um `BLOB` (Float32 little-endian) e a
# busca por similaridade é uma varredura linear filtrada por tenant/dimensões
# (ver `.docs/rag-architecture.md`), sem índice vetorial nativo. Um vector
# store externo (Qdrant/Pinecone...) fica para quando o volume exigir.
# Porta 3307 no host para não colidir com um MySQL local na 3306.
#
#   docker compose -f infra/db/docker-compose.yml up -d
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: geduc_rag
      MYSQL_USER: rag
      MYSQL_PASSWORD: rag
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysqldata:/var/lib/mysql
    ports:
      - "3307:3306"
    restart: unless-stopped

volumes:
  mysqldata:
